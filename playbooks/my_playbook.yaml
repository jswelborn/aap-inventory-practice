---
- name: Curveball 5
  hosts: localhost
  gather_facts: false

  vars:
    default_config:
      timezone: UTC
      ntp_server: time.company.com
      logging: enabled
      backup: daily

    customer_config:
      timezone: America/New_York
      backup: weekly

  tasks:
    - name: Parse inventory
      ansible.builtin.debug:
        msg: "{{ default_config | combine(customer_config) }}"
      tags:
        - parse_inventory

    - name: Throwaway tasks
      ansible.builtin.debug:
        msg: "This is a throwaway task"
      tags:
        - throwaway
