---
- hosts: localhost
  gather_facts: false
  tasks:
    - name: Parse inventory
      ansible.builtin.debug:
        msg: >-
             Inventory hostname: {{ item.key }}
             IP Address: {{ item.value.ansible_host }}
             Environment: {{ item.value.environment_name }}
             Application: {{ item.value.application_name }}
      loop: "{{ hostvars | dict2items }}"
