---
- name: Report inventory hosts
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Display inventory report
      ansible.builtin.debug:
        msg: >-
          Inventory hostname: {{ item }}
          IP Address: {{ hostvars[item].ansible_host }}
          Environment: {{ hostvars[item].environment_name }}
          Application: {{ hostvars[item].application_name }}
      loop: "{{ query('ansible.builtin.inventory_hostnames', 'all') }}"